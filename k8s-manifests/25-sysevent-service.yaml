apiVersion: v1
kind: Service
metadata:
  name: sysevent
  namespace: sysevent
  labels:
    app: sysevent
spec:
  selector:
    app: sysevent
  # Public LoadBalancer for the sysevent web UI (event history / schedule view)
  # on port 80. This provisions an AWS ELB with a public hostname.
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
